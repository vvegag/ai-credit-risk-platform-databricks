name: Tests

# Roda a suíte de testes leve a cada push/PR: análise estática (sem Spark/Databricks) +
# testes que usam uma SparkSession local (`tests/conftest.py`), não um workspace real.
# Também roda `10_rag_agent/tests/test_config.py` — o único teste do submódulo RAG que não
# depende de workspace real (os demais em `10_rag_agent/tests/test_rag_agent.py` importam
# `VectorSearchClient`/`ChatDatabricks`/`SentenceTransformer` de verdade, então ficam de fora).
# Não substitui validação no workspace real — os notebooks continuam exigindo Databricks
# para rodar de fato — mas pega regressões estruturais (ex: leakage) antes do merge.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install test dependencies
        # numpy: pyspark.ml (usado pelos testes de clustering, Fase C do roadmap) depende
        # dele em runtime mas não o declara como dependência do pacote pyspark.
        run: pip install pytest pyspark numpy

      - name: Run tests
        run: pytest tests/ 10_rag_agent/tests/test_config.py -v
